name: Fetch Forex Factory Calendar

on:
  schedule:
    # UTC 0:00, 6:00, 12:00, 18:00 に実行（6時間ごと）
    - cron: '0 */6 * * *'

  # Actions画面からの手動実行
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Run script
        run: |
          python fetch_calendar.py

      - name: Check calendar_data.json
        run: |
          echo "=== calendar_data.json ==="
          ls -lh calendar_data.json
          head -c 500 calendar_data.json || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar_data.json

          if git diff --cached --quiet; then
            echo "calendar_data.json に変更はありません"
          else
            git commit -m "Auto-update calendar_data.json"
            git push
          fi
